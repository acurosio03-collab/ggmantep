    <script>
      let lastTouchEnd = 0
      document.addEventListener(
        'touchstart',
        function (event) {
          if (event.touches.length > 1) {
            event.preventDefault()
          }
        },
        { passive: false }
      )

      document.addEventListener(
        'touchend',
        function (event) {
          const now = new Date().getTime()
          if (now - lastTouchEnd <= 300) {
            event.preventDefault()
          }
          lastTouchEnd = now
        },
        { passive: false }
      )

      document.addEventListener(
        'gesturestart',
        function (event) {
          event.preventDefault()
        },
        { passive: false }
      )
    </script>
